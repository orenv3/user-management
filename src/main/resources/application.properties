logging.level.root=INFO

# Default profile for local development. Override with:
# - SPRING_PROFILES_ACTIVE=docker   (docker compose)
# - SPRING_PROFILES_ACTIVE=prod     (production)
spring.profiles.default=local

# Shared defaults across profiles
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT signing secret (Base64). In docker/prod, set via env var JWT_SECRET.
jwt.secret=${JWT_SECRET:}

# Private admin (SEED_ADMIN1) — hidden from lists and protected from edits
app.private-admin-email=${SEED_ADMIN1_EMAIL:}


