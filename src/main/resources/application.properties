logging.level.root=INFO

# Default profile for local development. Override with:
# - SPRING_PROFILES_ACTIVE=docker   (docker compose)
# - SPRING_PROFILES_ACTIVE=prod     (production)
spring.profiles.default=local

# Shared defaults across profiles
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT signing secret (Base64). In docker/prod, set via env var JWT_SECRET.
jwt.secret=${JWT_SECRET:}

# Private admin (SEED_ADMIN1) — hidden from lists and protected from edits
app.private-admin-email=${SEED_ADMIN1_EMAIL:}

# Public frontend config (served at GET /api/config; no image rebuild required)
app.frontend.demo-video-url=${DEMO_VIDEO_URL:${VITE_DEMO_VIDEO_URL:}}
app.frontend.project-repo-url=${PROJECT_REPO_URL:${VITE_PROJECT_REPO_URL:}}
app.frontend.seed-user-name=${SEED_USER1_NAME:${VITE_SEED_USER_NAME:}}
app.frontend.seed-user-email=${SEED_USER1_EMAIL:${VITE_SEED_USER_EMAIL:}}
app.frontend.seed-user-password=${SEED_USER1_PASSWORD:${VITE_SEED_USER_PASSWORD:}}
app.frontend.seed-admin-name=${SEED_ADMIN2_NAME:${VITE_SEED_ADMIN_NAME:}}
app.frontend.seed-admin-email=${SEED_ADMIN2_EMAIL:${VITE_SEED_ADMIN_EMAIL:}}
app.frontend.seed-admin-password=${SEED_ADMIN2_PASSWORD:${VITE_SEED_ADMIN_PASSWORD:}}

